<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klak Emporium</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231baf7a'/%3E%3Cstop offset='1' stop-color='%232a78d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-width='6' stroke-linecap='round' fill='none'%3E%3Cpath d='M26 20 V52'/%3E%3Cpath d='M26 36 L46 20'/%3E%3Cpath d='M26 36 L46 52'/%3E%3C/g%3E%3Ccircle cx='46' cy='20' r='4' fill='%23fff'/%3E%3Ccircle cx='46' cy='52' r='4' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand" id="brandBox">
        <svg class="klogo" viewBox="0 0 72 72" aria-hidden="true">
          <defs>
            <linearGradient id="klakGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1baf7a"/><stop offset="1" stop-color="#2a78d6"/>
            </linearGradient>
          </defs>
          <g class="pins"><rect x="1" y="24" width="7" height="5" rx="2.5"/><rect x="1" y="33.5" width="7" height="5" rx="2.5"/><rect x="1" y="43" width="7" height="5" rx="2.5"/><rect x="64" y="24" width="7" height="5" rx="2.5"/><rect x="64" y="33.5" width="7" height="5" rx="2.5"/><rect x="64" y="43" width="7" height="5" rx="2.5"/></g>
          <rect x="8" y="8" width="56" height="56" rx="16" fill="url(#klakGrad)"/>
          <g stroke="#fff" stroke-width="5.5" stroke-linecap="round" fill="none"><path d="M27 22 V50"/><path d="M27 36 L45 22"/><path d="M27 36 L45 50"/></g>
          <circle cx="45" cy="22" r="3.4" fill="#fff"/><circle cx="45" cy="50" r="3.4" fill="#fff"/>
        </svg>
        <span class="kword"><span class="kname">KLAK</span></span>
        <button class="side-toggle" id="sideToggle" title="Ocultar menu">«</button>
      </div>

      <button class="nav-item active" data-route="dashboard" title="Dashboard"><span class="ico">📊</span><span class="lbl-txt">Dashboard</span></button>
      <button class="nav-item" data-route="estoque" title="Estoque"><span class="ico">📦</span><span class="lbl-txt">Estoque</span></button>
      <button class="nav-item" data-route="vendas" title="Vendas"><span class="ico">💰</span><span class="lbl-txt">Vendas</span></button>
      <button class="nav-item" data-route="viagens" title="Viagens"><span class="ico">🚗</span><span class="lbl-txt">Viagens</span></button>
      <button class="nav-item" data-route="vitrine" title="Vitrine"><span class="ico">🛍️</span><span class="lbl-txt">Vitrine</span></button>
      <button class="nav-item" data-route="config" title="Configurações"><span class="ico">⚙️</span><span class="lbl-txt">Configurações</span></button>
      <button class="nav-item" data-route="ideias" title="Ideias"><span class="ico">💡</span><span class="lbl-txt">Ideias</span></button>

      <div class="sidebar-foot">
        <button class="btn ghost sm" id="themeToggle"><span id="themeIco">🌙</span> <span id="themeLbl">Modo escuro</span></button>
      </div>
    </aside>

    <main class="main" id="view"></main>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="modalRoot"></div>
  <div class="chart-tip" id="chartTip"></div>

  <script src="app.js?v=8"></script>
</body>
</html>
